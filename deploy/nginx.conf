# hatiwal-map — the single public entry point for map.hatiwal.com
#
# Serves the style JSON and glyph PBFs as static files, and proxies tile
# requests to the go-pmtiles container. One front door so caching, CORS and
# attribution behave identically for every asset a client needs.

server {
    listen 80;
    server_name _;

    # NO server-level CORS header. It would also apply to the proxied tile
    # location below, where `pmtiles serve --cors "*"` already sets its own —
    # and TWO Access-Control-Allow-Origin headers is an invalid response that
    # browsers refuse with a bare `net::ERR_FAILED`. curl reports 200 and the
    # headers look right read one at a time, so this is only visible in a real
    # render. CORS is therefore set per-location: on the static blocks nginx
    # owns, and never on the proxy.

    gzip on;
    gzip_types application/json application/x-protobuf;
    gzip_min_length 512;

    # Glyphs never change once published — a font range is immutable by
    # definition. A year is safe and keeps them out of every later request.
    location /fonts/ {
        alias /srv/static/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Styles are the DESIGN, so they must be changeable without an app release.
    # Short cache on purpose: an hour, so a colour fix reaches users the same
    # day instead of at the next store review.
    location /styles/ {
        alias /srv/static/styles/;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Tiles. `pmtiles serve` already gzips and sets its own headers; we add the
    # long cache because a generated tileset is immutable until regenerated —
    # a refresh ships under a new path (see README, step "refresh").
    location / {
        proxy_pass http://hatiwal_map_tiles:8080;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # `pmtiles serve` owns this response's CORS and Content-Encoding. We add
        # only caching, and via `expires` alone — a second Cache-Control
        # add_header would duplicate that too.
        expires 30d;
    }
}
